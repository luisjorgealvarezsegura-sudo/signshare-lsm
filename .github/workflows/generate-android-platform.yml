name: Generate Android Platform

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  generate-android:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Show Flutter version
        run: flutter --version

      - name: Generate Android platform files
        run: flutter create --platforms=android --org com.signshare --project-name signshare_lsm .

      - name: Get dependencies
        run: flutter pub get

      - name: Analyze project
        run: flutter analyze

      - name: Test project
        run: flutter test

      - name: Build debug APK to verify Android platform
        run: flutter build apk --debug

      - name: Commit Android platform files
        run: |
          git config user.name "github-actions"
          git config user.email "github-actions@github.com"
          git add android .metadata pubspec.lock
          git commit -m "Add Android platform files" || echo "No changes to commit"
          git push
